<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI College Helpdesk</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.screen{min-height:100vh}.splash{display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(135deg,#1261ed,#67a0ff);color:white}
.logo{width:105px;height:105px;background:white;color:#1769ff;border-radius:30px;display:grid;place-items:center;font-size:52px;margin:auto;box-shadow:0 15px 35px #0003}
.splash h1{font-size:34px;margin:22px 0 8px}.splash p{opacity:.9}.btn{background:#1769ff;color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:bold}.white{background:#fff;color:#1769ff;margin-top:18px}
.auth{display:grid;place-items:center;min-height:100vh;padding:20px;background:#eef4ff}.box{background:#fff;padding:28px;border-radius:24px;width:min(430px,100%);box-shadow:0 15px 45px #0001}
.box h2{margin:0 0 6px}.muted{color:#718096}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:11px}
.tabs{display:flex;background:#eef3fa;padding:4px;border-radius:11px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px}.tabs .on{background:white;color:#1769ff;font-weight:bold}
.layout{display:flex;min-height:100vh}.side{width:245px;background:white;border-right:1px solid #e5eaf2;padding:22px;position:fixed;top:0;bottom:0}.brand{font-size:19px;font-weight:bold;color:#1769ff;margin-bottom:25px}.side button{width:100%;padding:12px;text-align:left;border:0;background:white;border-radius:11px;margin:3px 0;color:#4b5565}.side button:hover,.side button.active{background:#eaf2ff;color:#1769ff;font-weight:bold}
.main{margin-left:245px;padding:25px;width:calc(100% - 245px)}.top{display:flex;justify-content:space-between;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;background:#dce9ff;color:#1769ff;display:grid;place-items:center;font-weight:bold}.search{width:100%;padding:15px;border:1px solid #e0e7f0;border-radius:15px;margin:20px 0;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid #e7ecf3;border-radius:18px;padding:19px;box-shadow:0 5px 18px #00000008}.service{cursor:pointer}.service:hover{transform:translateY(-2px);box-shadow:0 10px 25px #1769ff16}.icon{font-size:27px}.card h3{margin:9px 0 6px}.card p{color:#667085;font-size:14px;line-height:1.5}.chat{background:white;border-radius:18px;border:1px solid #e4eaf2;height:550px;display:flex;flex-direction:column}.messages{flex:1;padding:18px;overflow:auto}.msg{max-width:78%;padding:12px 15px;border-radius:16px;margin:9px 0;line-height:1.5}.ai{background:#eef4ff}.me{margin-left:auto;background:#1769ff;color:white}.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid #e5eaf2}.chatbar input{flex:1;padding:12px;border:1px solid #dce3ef;border-radius:11px}.notice{margin-bottom:12px}.badge{display:inline-block;background:#e8f1ff;color:#1769ff;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:bold}
.bottom{display:none}
@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:18px 15px 80px}.grid{grid-template-columns:repeat(2,1fr)}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}.bottom button{flex:1;border:0;background:white;padding:10px 2px;font-size:11px}.chat{height:500px}}
@media(max-width:500px){.grid{gap:10px}.card{padding:14px}.splash h1{font-size:27px}}

.ai-grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:15px;margin-top:18px}
.quick{background:linear-gradient(135deg,#1769ff,#5d95ff);color:#fff;border-radius:18px;padding:18px}
.progress{height:10px;background:#e7edf6;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#1769ff}
.timeline{border-left:3px solid #dce8ff;padding-left:18px}.timeline div{margin:15px 0}.timeline b{color:#1769ff}
.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:13px 17px;border-radius:12px;z-index:50;box-shadow:0 10px 30px #0003}
@media(max-width:1000px){.ai-grid{grid-template-columns:repeat(2,minmax(220px,1fr))}}
@media(max-width:500px){.ai-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var currentUser=null,currentPage="home",role="student";
var demoStudent={name:"Mageswari C",id:"STU001",email:"student@college.edu",dept:"Computer Science & Engineering",year:"1st Year",role:"student",pass:"student123"};
var demoStaff={name:"College Staff",id:"STAFF001",email:"staff@college.edu",dept:"Administration",year:"Staff",role:"staff",pass:"staff123"};

function splash(){root.innerHTML='<div class="screen splash"><div><div class="logo">🤖</div><h1>AI College Helpdesk Assistant</h1><p>Your Smart Guide for a Better College Experience</p><button class="btn white" onclick="loginPage()">Get Started</button></div></div>'}
function loginPage(){root.innerHTML='<div class="auth"><div class="box"><h2>Welcome Back</h2><p class="muted">Login to continue</p><div class="tabs"><button class="on">Login</button><button onclick="registerPage()">Sign Up</button></div><div class="field"><label>Student ID / Staff ID / Email</label><input id="lid" placeholder="STU001"></div><div class="field"><label>Password</label><input id="lp" type="password" placeholder="Password"></div><button class="btn" style="width:100%" onclick="login()">Login</button><p class="muted" style="font-size:12px;text-align:center">Student: STU001 / student123<br>Staff: STAFF001 / staff123</p></div></div>'}
function registerPage(){root.innerHTML='<div class="auth"><div class="box"><h2>Create Account</h2><p class="muted">Register for the prototype</p><div class="tabs"><button id="st" class="on" onclick="setRole(\'student\')">Student</button><button id="sf" onclick="setRole(\'staff\')">Staff</button></div><div id="reg"></div><button class="btn" style="width:100%" onclick="register()">Create Account</button><p><button style="border:0;background:none;color:#1769ff" onclick="loginPage()">← Back to Login</button></p></div></div>';setRole("student")}
function setRole(r){role=r;document.getElementById("st").className=r==="student"?"on":"";document.getElementById("sf").className=r==="staff"?"on":"";document.getElementById("reg").innerHTML='<div class="field"><label>Full Name</label><input id="rn"></div><div class="field"><label>'+ (r==="student"?"Student ID":"Staff ID")+'</label><input id="ri"></div><div class="field"><label>Email</label><input id="re" type="email"></div><div class="field"><label>Department</label><select id="rd"><option>CSE</option><option>IT</option><option>ECE</option><option>Mechanical</option><option>Civil</option><option>AI & Data Science</option></select></div><div class="field"><label>Password</label><input id="rp" type="password"></div>'}
function register(){if(!rn.value||!ri.value||!re.value||rp.value.length<6){alert("Fill all fields. Password must be 6+ characters.");return}var u={name:rn.value,id:ri.value,email:re.value,dept:rd.value,year:role==="student"?"1st Year":"Staff",role:role,pass:rp.value};localStorage.setItem("user_"+u.id,JSON.stringify(u));alert("Registration successful. Please login.");loginPage()}
function login(){var id=lid.value,p=lp.value,u=null;if(id==="STU001")u=demoStudent;else if(id==="STAFF001")u=demoStaff;else{try{u=JSON.parse(localStorage.getItem("user_"+id))}catch(e){}}if(!u||u.pass!==p){alert("Invalid login details.");return}currentUser=u;currentPage="home";dashboard()}
function logout(){currentUser=null;splash()}
function nav(p,label){return '<button class="'+(currentPage===p?"active":"")+'" onclick="go(\''+p+'\')">'+label+'</button>'}
function dashboard(){root.innerHTML='<div class="layout"><aside class="side"><div class="brand">🤖 AI College Helpdesk</div>'+nav("home","🏠 Home")+nav("chat","💬 AI Assistant")+nav("advanced","🚀 Smart Features")+(currentUser.role==="staff"?nav("requests","📋 OD Requests"):"")+nav("notices","🔔 Notices")+nav("departments","🏢 Departments")+nav("facilities","🏫 Facilities")+nav("profile","👤 Profile")+'<button onclick="logout()">🚪 Logout</button></aside><main class="main"><div class="top"><div><h2>'+title()+'</h2><span class="muted">'+(currentUser.role==="staff"?"Staff":"Student")+' Dashboard</span></div><div class="avatar">'+currentUser.name.charAt(0).toUpperCase()+'</div></div>'+content()+'</main><div class="bottom"><button onclick="go(\'home\')">🏠<br>Home</button><button onclick="go(\'chat\')">💬<br>Chat</button><button onclick="go(\'notices\')">🔔<br>Notices</button><button onclick="go(\'profile\')">👤<br>Profile</button></div></div>'}
function go(p){currentPage=p;dashboard()}
function title(){return {home:"AI College Helpdesk Assistant",chat:"AI Helpdesk",notices:"Notices",departments:"Departments",facilities:"Facilities",profile:"My Profile",requests:"OD Requests"}[currentPage]||"College Services"}
function content(){
if(currentPage==="home")return '<input class="search" placeholder="Ask me anything..." onclick="go(\'chat\')"><div class="card quick"><h3>🚀 Smart College Features</h3><p style="color:white">AI + Voice + Notifications + Tamil/English + Analytics</p><button class="btn white" onclick="go(\'advanced\')">Explore 10 Advanced Features</button></div><br><div class="grid">'+svc("📚","Academic Information","Calendar, courses & syllabus","academic")+svc("📝","Exams & Results","Schedules, marks & results","exams")+svc("💳","Fees & Payments","Fee status & payment dates","fees")+svc("🕐","Timetable","View class timetable","academic")+svc("📄","Leave / OD","Apply and track requests","leave")+svc("🏢","Departments","Faculty & contact details","departments")+svc("🏫","Facilities","Library, labs, hostel & more","facilities")+svc("🔔","Notices","Latest announcements","notices")+'</div>';
if(currentPage==="chat")return '<div class="chat"><div class="messages" id="msgs"><div class="msg ai">👋 Hi '+currentUser.name+'! I am your AI College Helpdesk Assistant.<br><br>Try asking:<br>• When is the next exam?<br>• How can I apply for OD?<br>• What is my fee status?</div></div><div class="chatbar"><input id="ci" placeholder="Ask me anything..." onkeydown="if(event.key===\'Enter\')send()"><button class="btn" onclick="send()">Send</button></div></div>';
if(currentPage==="academic")return '<div class="grid">'+svc("📅","Academic Calendar","Important academic dates","home")+svc("📖","Course Details","Course information","home")+svc("📘","Syllabus","View syllabus","home")+svc("🕐","Class Timings","Class schedule","home")+'</div>';
if(currentPage==="exams")return '<div class="card"><h3>📅 Exam Schedule</h3><p><b>Next Internal Assessment:</b> 15 September 2026</p><p>Semester Examination: 10 November 2026</p><span class="badge">Updated</span><hr><h3>📊 Internal Marks</h3><p>Data Structures: 82% · Java: 78% · DBMS: 85%</p></div>';
if(currentPage==="fees")return '<div class="grid"><div class="card"><h3>₹85,000</h3><p>Total Fee</p></div><div class="card"><h3>₹60,000</h3><p>Paid</p></div><div class="card"><h3>₹25,000</h3><p>Pending</p></div></div><br><div class="card"><h3>Payment Status</h3><p>71% completed</p><div style="height:12px;background:#e8edf5;border-radius:8px"><div style="width:71%;height:100%;background:#1769ff;border-radius:8px"></div></div></div>';
if(currentPage==="leave")return '<div class="card"><h3>📄 Apply for Leave / OD</h3><div class="field"><label>Type</label><select id="ot"><option>OD</option><option>Leave</option></select></div><div class="field"><label>Date</label><input id="od" type="date"></div><div class="field"><label>Reason</label><textarea id="or" rows="4"></textarea></div><button class="btn" onclick="submitOD()">Submit Request</button><hr><h3>Current Status</h3><p>'+ (localStorage.getItem("od_"+currentUser.id)||"No request submitted.")+'</p></div>';
if(currentPage==="notices")return '<div>'+["Internal Exam Timetable Released","Fee Payment Last Date Extended","Technical Fest Registration Open","College Holiday Announcement"].map(function(x){return '<div class="card notice"><span class="badge">NEW</span><h3>'+x+'</h3><p>Important college announcement. Please check the concerned department for details.</p><small>29 September 2026 · Administration</small></div>'}).join("")+'</div>';
if(currentPage==="departments")return '<div class="grid">'+["Computer Science & Engineering","Information Technology","Electronics & Communication","Mechanical Engineering","Civil Engineering","AI & Data Science"].map(function(x){return '<div class="card"><div class="icon">🏢</div><h3>'+x+'</h3><p>HOD: Dr. College Faculty<br>📞 0427-0000000<br>📍 Main Academic Block</p></div>'}).join("")+'</div>';
if(currentPage==="facilities")return '<div class="grid">'+["Library","Computer Labs","Digital Library","Auditorium","Cafeteria","Hostel","Transportation","Sports Facilities"].map(function(x){return '<div class="card service"><div class="icon">🏫</div><h3>'+x+'</h3><p>College facility information.</p></div>'}).join("")+'</div>';
if(currentPage==="profile")return '<div class="card" style="max-width:600px"><div class="avatar">'+currentUser.name.charAt(0)+'</div><h2>'+currentUser.name+'</h2><p><b>ID:</b> '+currentUser.id+'</p><p><b>Department:</b> '+currentUser.dept+'</p><p><b>Year:</b> '+currentUser.year+'</p><p><b>Email:</b> '+currentUser.email+'</p><button class="btn" onclick="logout()">Logout</button></div>';
if(currentPage==="advanced")return '<div class="card quick"><h3>🕐 24/7 AI College Assistant</h3><p style="color:white">Always available for greetings, doubts, library location, building details, staff information, timetable and college guidance.</p><button class="btn white" onclick="go(\'chat\')">Start 24/7 Assistant</button></div><div class="ai-grid">'+
'<div class="card"><div class="icon">🕐</div><h3>1. 24/7 AI Assistant</h3><p>Instant college help anytime, including nights and weekends.</p><button class="btn" onclick="go(\'chat\')">Ask AI</button></div>'+'<div class="card"><div class="icon">💬</div><h3>2. Natural Conversation</h3><p>Understands Hi, Hello, Thanks and normal student questions.</p><button class="btn" onclick="naturalDemo()">Try</button></div>'+'<div class="card"><div class="icon">🎙️</div><h3>3. Voice AI</h3><p>Speak your question and convert speech to text.</p><button class="btn" onclick="voiceDemo()">Start Voice</button></div>'+'<div class="card"><div class="icon">🌐</div><h3>4. Tamil + English</h3><p>Supports student questions in English and Tamil.</p><button class="btn" onclick="languageDemo()">Switch</button></div>'+'<div class="card"><div class="icon">🧠</div><h3>5. Personalized AI</h3><p>Uses department and year context for relevant guidance.</p><button class="btn" onclick="smartDemo()">Personalize</button></div>'+'<div class="card"><div class="icon">📍</div><h3>6. Library Location</h3><p>Gives the library location and opens the campus map.</p><button class="btn" onclick="libraryDemo()">Open Location</button></div>'+'<div class="card"><div class="icon">🏢</div><h3>7. Building Details</h3><p>Shows academic blocks, labs, library and important buildings.</p><button class="btn" onclick="buildingDemo()">View Details</button></div>'+'<div class="card"><div class="icon">👨‍🏫</div><h3>8. Staff Details</h3><p>Shows department, HOD/faculty role and contact information.</p><button class="btn" onclick="staffDemo()">View Staff</button></div>'+'<div class="card"><div class="icon">🕐</div><h3>9. Timetable</h3><p>Shows sample class timetable by day and period.</p><button class="btn" onclick="timetableDemo()">Show Timetable</button></div>'+'<div class="card"><div class="icon">📝</div><h3>10. Exam Information</h3><p>Provides exam dates, internal assessment and results guidance.</p><button class="btn" onclick="examDemo()">Show Exams</button></div>'+'<div class="card"><div class="icon">🔔</div><h3>11. Smart Notifications</h3><p>Alerts students about important updates and deadlines.</p><button class="btn" onclick="notifyDemo()">Test Alert</button></div>'+'<div class="card"><div class="icon">📚</div><h3>12. AI Study Assistant</h3><p>Helps explain topics and provides simple study guidance.</p><button class="btn" onclick="studyDemo()">Study Help</button></div>'+'<div class="card"><div class="icon">🤝</div><h3>13. Staff Escalation</h3><p>Routes unanswered questions to the appropriate department.</p><button class="btn" onclick="escalateDemo()">Escalate</button></div>'+'<div class="card"><div class="icon">🗂️</div><h3>14. Conversation History</h3><p>Keeps recent AI questions for quick reference.</p><button class="btn" onclick="historyDemo()">View History</button></div>'+'<div class="card"><div class="icon">⭐</div><h3>15. AI Feedback</h3><p>Students can rate responses and send suggestions.</p><button class="btn" onclick="feedbackDemo()">Give Feedback</button></div>'+'<div class="card"><div class="icon">⏰</div><h3>16. Deadline Tracker</h3><p>Shows upcoming fee, exam and registration deadlines.</p><button class="btn" onclick="predictDemo()">Show Deadlines</button></div>'+'</div>';
if(currentPage==="requests")return '<div class="card"><h3>📋 OD Requests</h3><p><b>STU001</b> · Hackathon participation</p><span class="badge">Pending</span><br><br><button class="btn" onclick="alert(\'OD Approved\')">Approve</button> <button class="btn" style="background:#e74c3c" onclick="alert(\'OD Rejected\')">Reject</button></div>';
return "";
}
function svc(i,t,d,p){return '<div class="card service" onclick="go(\''+p+'\')"><div class="icon">'+i+'</div><h3>'+t+'</h3><p>'+d+'</p></div>'}
function send(){var x=ci.value.trim();if(!x)return;var m=document.getElementById("msgs"),key="chatHistory_"+currentUser.id,hist=JSON.parse(localStorage.getItem(key)||"[]");hist.push(x);localStorage.setItem(key,JSON.stringify(hist.slice(-30)));m.innerHTML+='<div class="msg me">'+x+'</div>';var q=x.toLowerCase(),a="Sure! I can help you with that. Tell me the topic or college service you need, and I’ll guide you step by step.";if(/^(hi|hii|hello|hey|good morning|good afternoon|good evening)[ !.,]*$/i.test(x))a="👋 Hi! Hello! I’m your 24/7 AI College Helpdesk Assistant. How can I help you today? You can ask about library location, buildings, staff, timetable, exams, fees, OD, leave or any college topic.";else if(q.indexOf("thank")>=0||q.indexOf("thanks")>=0)a="😊 You’re welcome! I’m always here to help. Ask me anything about the college.";else if(q.indexOf("library")>=0||q.indexOf("lib")>=0)a=`📚 The college library is located in the Main Academic Block, Ground Floor. <br><br><a href="https://www.google.com/maps/search/?api=1&query=Mahendra+Engineering+College+Mallasamudram+Tamil+Nadu" target="_blank" style="color:#1769ff;font-weight:bold">📍 Open Library Location in Google Maps</a>`;else if(q.indexOf("building")>=0||q.indexOf("block")>=0)a="🏢 Main Academic Block: CSE, IT and central academic offices.<br>🧪 Science Block: Science laboratories.<br>📚 Library Block: Library and digital resources.<br>🏫 Admin Block: Principal and administration office.";else if(q.indexOf("staff")>=0||q.indexOf("faculty")>=0||q.indexOf("hod")>=0)a="👨‍🏫 Staff Details:<br>Department: "+currentUser.dept+"<br>HOD: Dr. College Faculty<br>Office: Main Academic Block<br>Contact: 0427-0000000";else if(q.indexOf("timetable")>=0||q.indexOf("time table")>=0||q.indexOf("class time")>=0)a="🕐 Today’s sample timetable:<br>9:00–10:00 Data Structures<br>10:00–11:00 Python Programming<br>11:15–12:15 Mathematics<br>1:15–2:15 Database Management Systems<br>2:15–3:15 Lab / Activity.";else if(q.indexOf("exam")>=0||q.indexOf("test")>=0)a="📅 Exam information: Next Internal Assessment is scheduled for 15 September 2026 in this prototype. I can also show the exam section.";else if(q.indexOf("od")>=0||q.indexOf("leave")>=0)a="📄 I can help with OD/Leave. Open Leave / OD, choose the request type, select the date, enter your reason and submit.";else if(q.indexOf("fee")>=0||q.indexOf("fees")>=0)a="💳 Demo fee status: ₹60,000 paid and ₹25,000 pending. Open Fees & Payments for more details.";else if(q.indexOf("doubt")>=0||q.indexOf("topic")>=0||q.indexOf("explain")>=0||q.indexOf("help me")>=0)a="👍 Okay! I’ll explain that topic in a simple way. Please tell me the topic name or paste your question here.";else if(q.indexOf("good morning")>=0)a="🌞 Good morning! How can I help you with your college work today?";else if(q.indexOf("good night")>=0)a="🌙 Good night! I’m available 24/7 whenever you need college assistance.";m.innerHTML+='<div class="msg ai">'+a+'</div>';ci.value="";m.scrollTop=m.scrollHeight}
function submitOD(){if(!od.value||!or.value){alert("Enter date and reason.");return}localStorage.setItem("od_"+currentUser.id,"🟡 Pending · "+ot.value+" · "+od.value+" · "+or.value);alert("Request submitted successfully!");dashboard()}

function toast(msg){var t=document.createElement("div");t.className="toast";t.innerHTML=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500)}
function voiceDemo(){if("webkitSpeechRecognition" in window||"SpeechRecognition" in window){var R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang="en-IN";r.onresult=function(e){go("chat");setTimeout(function(){document.getElementById("ci").value=e.results[0][0].transcript},100)};r.start();toast("🎙️ Listening... Speak now");}else toast("🎙️ Voice input is not supported in this browser.")}
function languageDemo(){toast("🌐 Language switched: Tamil ↔ English")}
function smartDemo(){toast("🧠 AI context loaded for "+currentUser.dept+" · "+currentUser.year)}
function notifyDemo(){toast("🔔 New notification: Internal Exam timetable updated")}
function documentDemo(){var i=document.createElement("input");i.type="file";i.accept=".pdf,.jpg,.png,.doc,.docx";i.onchange=function(){if(i.files[0])toast("📁 "+i.files[0].name+" selected successfully")};i.click()}
function campusDemo(){toast("📍 Main Academic Block · CSE Department")}
function escalateDemo(){toast("🤝 Query routed to the concerned department")}
function analyticsDemo(){alert("Staff Analytics\\n\\nStudent Queries: 124\\nOD Requests: 18\\nPending: 5\\nNotices Published: 12")}

function naturalDemo(){go("chat");setTimeout(function(){document.getElementById("ci").value="Hi"},100)}
function libraryDemo(){alert("📚 Library Location\nMain Academic Block · Ground Floor");window.open("https://www.google.com/maps/search/?api=1&query=Mahendra+Engineering+College+Mallasamudram+Tamil+Nadu","_blank")}
function buildingDemo(){alert("🏢 Building Details\n\nMain Academic Block - CSE, IT and academic offices\nScience Block - Science laboratories\nLibrary Block - Library and digital resources\nAdmin Block - Principal and administration office")}
function staffDemo(){alert("👨‍🏫 Staff Details\n\nDepartment: "+currentUser.dept+"\nHOD: Dr. College Faculty\nOffice: Main Academic Block\nContact: 0427-0000000")}
function timetableDemo(){alert("🕐 Sample Timetable\n\n9:00-10:00 Data Structures\n10:00-11:00 Python Programming\n11:15-12:15 Mathematics\n1:15-2:15 DBMS\n2:15-3:15 Lab / Activity")}
function examDemo(){alert("📝 Exam Information\n\nInternal Assessment: 15 September 2026\nSemester Examination: 10 November 2026")}
function studyDemo(){go("chat");setTimeout(function(){document.getElementById("ci").value="I have a doubt in my topic"},100)}
function historyDemo(){var h=JSON.parse(localStorage.getItem("chatHistory_"+currentUser.id)||"[]");alert(h.length?"💬 Recent Questions\n\n"+h.slice(-10).map(function(x){return "• "+x}).join("\n"):"No conversation history yet. Start chatting with the AI Assistant.")}
function feedbackDemo(){var r=prompt("Was the AI response helpful? Enter Helpful or Not Helpful:");if(r)toast("⭐ Thank you! Your feedback was recorded.")}
function predictDemo(){alert("⏰ Deadline Tracker\n\n• Fee deadline: 30 September\n• Exam reminder: 15 October\n• Registration deadline: approaching")}
splash();
</script>
</body>
</html>
